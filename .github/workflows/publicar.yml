name: Publicar no Instagram

# POR QUE ESTES MINUTOS ESTRANHOS
# -------------------------------
# A documentacao do GitHub avisa que execucoes agendadas sao adiadas - ou
# simplesmente descartadas - em periodos de carga alta, e que "o inicio de cada
# hora" e o pico. Como todo mundo agenda em :00 e :30, a fila entope justamente
# ai.
#
# Em 11 e 12/08/2026 rodaram 2 execucoes de ~40 esperadas, com cron em */30
# (ou seja, :00 e :30). As duas pecas do dia 12 tiveram que ser publicadas na mao.
#
# Agora dispara 4x por hora em minutos deslocados do pico, cobrindo a janela dos
# dois horarios (08:00 e 15:30 de Brasilia). A primeira execucao que rodar
# publica o que estiver pendente; as demais encontram o id em publicados.json e
# saem sem fazer nada.
#
# Repositorio publico: minutos de Actions sao gratuitos e ilimitados.
#
#   11:00-21:59 UTC = 08:00-18:59 de Brasilia
on:
  schedule:
    - cron: "7,22,38,53 11-21 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Forçar um slot (08:00 ou 15:30). Vazio = publica o que estiver pendente."
        required: false
        default: ""

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario para comitar publicados.json de volta

    # Evita que duas execucoes se atropelem na mesma janela.
    concurrency:
      group: publicar-instagram
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar o que estiver pendente
        env:
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python publicar.py ${{ github.event.inputs.slot }}

      - name: Registrar o que foi publicado
        run: |
          # Puxa antes de comitar: outra execucao da janela pode ter registrado
          # algo enquanto esta rodava.
          git pull --rebase --autostash origin main || true
          if [ -n "$(git status --porcelain publicados.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add publicados.json
            git commit -m "registro: publicado em $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "Nada novo para registrar."
          fi
